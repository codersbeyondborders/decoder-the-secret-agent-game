version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm install typescript
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.mp3'
      - '**/*.wav'
      - '**/*.json'
      - '**/*.ico'
      - '**/*.svg'
    discard-paths: no
  cache:
    paths:
      - node_modules/**/*